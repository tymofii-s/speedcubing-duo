<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubing Streak Tracker</title>
    <script>
        async function updateStatus() {
            const response = await fetch("http://127.0.0.1:5000/status");
            const data = await response.json();
            document.getElementById("streak").innerText = `Streak: ${data.streak}`;
            document.getElementById("freezes").innerText = `Freezes: ${data.freezes}`;
            document.getElementById("reset_day").innerText = `Reset day: ${data.reset_day}`;
            
            if (data.lost_streak) {
                document.getElementById("lost_streak").innerText = "You have lost your streak!";
            } else {
                document.getElementById("lost_streak").innerText = "";
            }
        }

        async function processCSTimerData() {
            const inputText = document.getElementById("cstimer_input").value;
            const response = await fetch("http://127.0.0.1:5000/parse", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ cstimer_data: inputText })
            });
            const data = await response.json();
            document.getElementById("times_list").innerText = `Extracted times: ${data.times.join(", ")}`;
            document.getElementById("best_ao5").innerText = `Best ao5: ${data.best_ao5}`;
        }
        
        async function submitEntry() {
            const response = await fetch("http://127.0.0.1:5000/submit", { // <-- Змінив порт
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ entry: "Rubik's cube solved!" })
            });
            const data = await response.json();
            alert(data.message);
            updateStatus(); // Оновлюємо статус після додавання запису
        }
        
        window.onload = updateStatus;
    </script>
</head>
<body>
    <h1>Cubing Streak Tracker</h1>
    
    <h2>Enter csTimer Exported Data</h2>
    <textarea id="cstimer_input" rows="6" cols="50"></textarea>
    <button onclick="processCSTimerData()">Process</button>
    
    <h3>Results</h3>
    <p id="times_list">Times: </p>
    <p id="best_ao5">Best ao5: </p>
    
    <h2>Streak Status</h2>
    <p id="streak">Streak: </p>
    <p id="freezes">Freezes: </p>
    <p id="reset_day">Reset Day: </p>
    <p id="lost_streak" style="color:red;"></p>
    
    <button onclick="submitEntry()">Add Today's Entry</button>
</body>
</html>
